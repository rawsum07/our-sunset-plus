f.connect(m);f.connect(cv);cv.connect(wet);wet.connect(m);m.connect(C.destination);

function deepSky(){const ds=$("div");ds.id="deepsky";document.body.append(ds);ds.append($("div","stars"));
  const N=10,pool=[...Array(N)].map((_,i)=>{const e=$("div","dcloud");e.style.setProperty("--s",(.5+Math.random()*.9).toFixed(2));e.style.width=(160+Math.random()*160)+"px";ds.append(e);return{e,y:120+i*420+Math.random()*160,x:5+Math.random()*80}});

    if(running)rid=requestAnimationFrame(tick)}
  addEventListener("resize",resize);resize();seed();
  if(!red&&"IntersectionObserver"in window){const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting&&!running){running=true;canvas.classList.add("on");tick();Snd.rain&&Snd.rain(true)}else if(!e.isIntersecting&&running){running=false;canvas.classList.remove("on");cancelAnimationFrame(rid);Snd.rain&&Snd.rain(false)}})},{threshold:0});io.observe(ds)}
